[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-governance-runtime"
version = "1.6.0"
description = "Deterministic governance middleware for AI agents. V1.6: real memory persistence, signed checkpoints, failure/attack validation suite."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Raul Rodriguez Mesia", email = "raulrodriguezmesia-blip@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/raulrodriguezmesia-blip/aegis-governance-runtime"
Repository = "https://github.com/raulrodriguezmesia-blip/aegis-governance-runtime"
Issues = "https://github.com/raulrodriguezmesia-blip/aegis-governance-runtime/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "C90", "PLR", "PT", "RSE", "SIM", "T20"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true